<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CommonBrew POS - Inventory</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Use same palette and style as main dashboard */
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3a0ca3;
            --success: #4cc9f0;
            --warning: #f9c74f;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --border-radius: 16px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            padding: 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .dashboard-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 25px 20px;
            transition: var(--transition);
            text-align: center;
            text-decoration: none;
            color: var(--dark);
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="container text-center">
    <h2 class="mb-4 text-primary fw-bold">Inventory Management</h2>

    <div class="dashboard-grid">
        <a href="/inventory/ingredients" class="dashboard-card">
            <div class="card-icon text-success">
                <i class="bi bi-droplet-half"></i>
            </div>
            <div class="card-title fw-semibold">Ingredients</div>
            <div class="card-description text-muted">Manage raw materials</div>
        </a>

        <a href="/inventory/recipes" class="dashboard-card">
            <div class="card-icon text-warning">
                <i class="bi bi-journal-text"></i>
            </div>
            <div class="card-title fw-semibold">Recipes</div>
            <div class="card-description text-muted">Set ingredient quantities</div>
        </a>
    </div>

    <div class="mt-4">
        <a href="/" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</div>
</body>
</html>
