<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Ingredient - CommonBrew POS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --danger: #ef476f;
            --gray: #6c757d;
            --radius: 16px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            animation: fadeIn 0.4s ease-out;
        }

        .form-title {
            text-align: center;
            color: var(--primary);
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .form-subtitle {
            text-align: center;
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: var(--gray);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: scale(1.02);
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--primary);
            font-size: 14px;
            margin-top: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-title">Add Ingredient</div>
    <div class="form-subtitle">Enter details for a new ingredient</div>

    <form th:action="@{/inventory/ingredients/save}" th:object="${ingredient}" method="post">

        <!-- Ingredient Name -->
        <div class="mb-3">
            <label for="name" class="form-label">Ingredient Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Espresso Beans" required>
        </div>

        <!-- Unit -->
        <div class="mb-3">
            <label for="unit" class="form-label">Unit of Measurement</label>
            <input type="text" id="unit" th:field="*{unit}" class="form-control" placeholder="e.g. g, ml, scoop" required>
        </div>

        <!-- Category -->
        <!-- <div class="mb-3">
            <label for="category" class="form-label">Category (optional)</label>
            <select id="category" th:field="*{category}" class="form-select">
                <option value="">-- Select Category --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat}"
                        th:text="${cat}">
                </option>
            </select>
        </div> -->

        <!-- Active -->
        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" id="active" th:field="*{active}" checked>
            <label class="form-check-label" for="active">Active</label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-2"></i>Save Ingredient
        </button>
    </form>

    <a href="/inventory/ingredients" class="back-btn">
        ← Back to Ingredients
    </a>
</div>

</body>
</html>
