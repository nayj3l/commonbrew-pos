<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Place Order</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/order-form-default.css">
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/flavor.css">
    <link rel="stylesheet" href="/css/addon.css">
    <link rel="stylesheet" href="/css/order.css">
    <link rel="stylesheet" href="/css/item-form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
</head>

<body>

    <!-- Page Header -->
    <div class="app-header d-flex justify-content-between align-items-center p-3 shadow-sm rounded flex-wrap header-bg">
        <!-- Left: Dashboard -->
        <a href="/" class="header-btn d-flex align-items-center gap-2 mb-2 mb-md-0">
            <i class="bi bi-house-fill"></i>
            Dashboard
        </a>

        <!-- Right: See All Orders -->
        <a href="/order/history" class="header-btn-outline d-flex align-items-center gap-2 mb-2 mb-md-0">
            <i class="bi bi-card-list"></i>
            See All Orders
        </a>
    </div>


    <!-- Order Section -->
    <div class="order" id="orderContainer">
        <div class="card p-4 shadow-sm rounded">
            <h1 class="text-center mb-4 fw-bold">Menu</h1>

            <!-- Menu List -->
            <div class="categories-content" id="categories-container">
                <div class="category-grid">
                    <div th:each="menu : ${menu}" class="category-item">
                        <a class="category-btn" 
                        th:text="${menu.name}" 
                        th:onclick="'loadItems(' + ${menu.id} + ')'"
                        th:style="${menu.imageUrl != null} ? 
                            'background-image: url(\'' + ${menu.imageUrl} + '\') !important; 
                                background-size: cover !important; 
                                background-position: center !important; 
                                background-repeat: no-repeat !important;' : ''">
                            <div class="category-icon">
                                <i class="fas fa-mug-hot"></i>
                            </div>
                            <div class="category-name" th:text="${menu.name}">Category Name</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Items Modal -->
        <div th:replace="fragments/items-modal :: itemsModal"></div>

        <!-- Variant + Addons Modal -->
        <div th:replace="~{fragments/variant-addon-modal :: variantAddonModal}"></div>

        <!-- Current Order Section -->
        <div class="cart-container">
            <button class="cart-btn" type="button" onclick="confirmOrder()">
                Amount: <span id="order-total">₱0.00</span>
            </button>
        </div>

        <!-- Hidden form for submission -->
        <form id="order-form" method="post" th:action="@{/order/confirm}">
            <input type="hidden" name="itemIds" id="itemIds" /> 
            <input type="hidden" name="variantsIds" id="variantsIds" />
            <input type="hidden" name="quantities" id="quantities" />
            <input type="hidden" name="addonIds" id="addonIds" />
            <input type="hidden" name="addonQuantities" id="addonQuantities" />
        </form>

        <script th:src="@{/js/order-state.js}"></script>
        <script th:src="@{/js/categories.js}"></script>
        <script th:src="@{/js/addons.js}"></script>
        <script th:src="@{/js/order-rendering.js}"></script>
        <script th:src="@{/js/order-operations.js}"></script>
        <script th:src="@{/js/event-handlers.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Order Confirmation Modal -->
        <div class="modal fade" id="orderConfirmModal" tabindex="-1" aria-labelledby="orderConfirmModalLabel"
            aria-hidden="true">
            <div class="order-confirm-dialog modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="order-confirm-header modal-header justify-content-center">
                        <h5 class="modal-title" id="orderConfirmModalLabel">
                            Confirm Your Order
                        </h5>
                    </div>
                    <div class="modal-body" id="order-details">
                        <h6><em>Order Details</em></h6>
                        <div id="modal-order-summary"></div>
                        <div class="order-total mt-3">
                            Total: ₱<span id="modal-order-total">0.00</span>
                        </div>
                    </div>
                    <div class="modal-footer" id="variantModalFooter">
                        <button type="button" class="order-cancel-btn btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="button" class="order-confirm-btn btn btn-success" onclick="submitConfirmedOrder()">
                            Confirm Order
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", () => {
            window.preloadedMenus = [[${menu}]];
            window.preloadedItems = [[${items}]];
            window.preloadedVariants = [[${variants}]];
            window.preloadedAddons = [[${addons}]];
        });
    </script>
    <script th:src="@{/js/cache-manager.js}"></script>
    <script th:src="@{/js/select-flavor.js}"></script>
</body>

</html>
